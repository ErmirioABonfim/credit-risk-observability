[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-observability"
version = "1.0.0"
description = "Tech Challenge Fase 4 - Observabilidade, Drift, Data Contracts e Governanca para Credit Scoring"
requires-python = ">=3.10"

[project.scripts]
credit-risk = "credit_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
