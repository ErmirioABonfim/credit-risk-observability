name: scheduled-drift-monitoring

# Job agendado: em produção processaria o lote do mês corrente.
# Aqui reexecuta a simulação completa e publica o dashboard como artefato.
on:
  schedule:
    - cron: "0 9 1 * *"   # todo dia 1 do mês, 09:00 UTC
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
      PSEUDONYMIZATION_KEY: ${{ secrets.PSEUDONYMIZATION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt && pip install -e .
      - run: credit-risk run-all
      - name: Falha o job se houver alerta crítico (notifica o time via GitHub)
        run: |
          python - <<'PY'
          import json, sys
          alerts = [json.loads(l) for l in open("reports/alerts.jsonl", encoding="utf-8")]
          crit = [a for a in alerts if a["severity"] == "critical"]
          print(f"{len(alerts)} alertas, {len(crit)} críticos")
          for a in crit: print(f"::error::[{a['window']}] {a['message']}")
          sys.exit(1 if crit else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-dashboard-${{ github.run_number }}
          path: reports/
